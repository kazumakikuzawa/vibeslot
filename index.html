<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08020f" />
    <meta name="description" content="Three.jsで描く、換金要素なしのネオン3Dスロットゲーム" />
    <title>VIBE SLOT — Neon Rush</title>
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>

    <main class="game-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-kicker">NEON RUSH</span>
          <h1>VIBE<span>SLOT</span></h1>
        </div>
        <button id="soundButton" class="icon-button" type="button" aria-label="サウンドを切り替える" aria-pressed="true">♪</button>
      </header>

      <section class="machine" aria-label="スロットゲーム">
        <div class="jackpot" id="jackpotPanel">
          <span>MEGA JACKPOT</span>
          <strong id="jackpotValue">88,888</strong>
          <small>PLAY CREDITS · NO CASH VALUE</small>
        </div>

        <div class="reel-stage" id="reelStage">
          <div class="payline" aria-hidden="true"><i></i><span>PAYLINE</span><i></i></div>
          <div class="reel-glass" aria-hidden="true"></div>
          <div class="reel-labels" aria-live="polite" aria-atomic="true">
            <span id="reel0">7</span>
            <span id="reel1">7</span>
            <span id="reel2">7</span>
          </div>
          <div class="win-banner" id="winBanner" aria-live="assertive">
            <span id="winEyebrow">READY?</span>
            <strong id="winText">CHASE THE LIGHT</strong>
          </div>
        </div>

        <div class="meter-row">
          <div class="meter">
            <span>CREDITS</span>
            <strong id="credits">1,000</strong>
          </div>
          <div class="meter meter-hot">
            <span>LAST WIN</span>
            <strong id="lastWin">0</strong>
          </div>
          <div class="meter">
            <span>STREAK</span>
            <strong><b id="streak">0</b><small>x</small></strong>
          </div>
        </div>

        <div class="controls">
          <button id="spinButton" class="spin-button" type="button">
            <span class="spin-shine"></span>
            <small>BET 50</small>
            <strong>SPIN</strong>
          </button>
          <p>SPACEキーでもスピン</p>
        </div>
      </section>

      <footer>
        <span>FOR ENTERTAINMENT ONLY</span>
        <button id="rulesButton" type="button">配当表</button>
      </footer>
    </main>

    <dialog id="rulesDialog">
      <form method="dialog">
        <button class="dialog-close" aria-label="閉じる">×</button>
        <p class="dialog-kicker">PAYOUT MATRIX</p>
        <h2>光を揃えろ。</h2>
        <div class="payout-list">
          <div><span>7 7 7</span><strong>+1,000</strong></div>
          <div><span>★ ★ ★</span><strong>+500</strong></div>
          <div><span>◆ ◆ ◆</span><strong>+300</strong></div>
          <div><span>ANY × 3</span><strong>+120</strong></div>
          <div><span>7 × 2</span><strong>+50</strong></div>
        </div>
        <p class="fine-print">架空クレジットのみを使用します。購入、換金、賞品、課金要素はありません。</p>
      </form>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
